<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycle Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --weather-icon-cloud-front-color: #ffffff;
            --weather-icon-cloud-back-color: #969696;
            --weather-icon-sun-color: #ffa200;
            --weather-icon-moon-color: #ffea00;
            --weather-icon-rain-color: #1e1eae;
            --weather-icon-snow-color: #ffffff;
            --weather-icon-snow-stroke-color: #000000;

        }

        html {
            box-sizing: border-box;
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background-color: #c4d6ff;
        }

        .tall-container {
            width: 480px;
            height: 800px;
        }

        .good-bg {
            background-color: #1dad23;
        }

        .bad-bg {
            background-color: #ce2424;
        }

        .text-outline {
            text-shadow:
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                1px 1px 0 #000;
        }

        .maybe-bg {
            background-color: #1e1eae;
        }

        .weather-icon {
            width: 80px;
            height: 80px;
            stroke: #000;
            stroke-width: 0.3px;
        }
    </style>
</head>

<body class="flex min-h-screen">

    <div class="tall-container flex flex-col maybe-bg">
        <div class="flex flex-col p-6 gap-6">
            <div class="">
                <h1 class="text-5xl font-semibold text-left text-white">
                    Saturday, Aug 9
                </h1>
            </div>
            <div class="flex flex-row gap-4">
                
                <div class="flex-1 bg-white rounded-xl flex flex-col p-4 text-black shadow-md h-64">
                    <h2 class="text-base text-left font-semibold text-gray-600">8 AM TOMORROW</h2>
                    <div class="flex flex-col items-center">
                        <div class="flex flex-row items-center justify-center gap-2">
                            <div class="flex-shrink-0">
                                <svg class="weather-icon" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" viewBox="0 0 17 17"><path d="M3.886 5.035a3.5 3.5 0 0 0-1.437.864 3.45 3.45 0 0 0-1.02 2.455 3.47 3.47 0 0 0 3.483 3.468h6.969c1.925 0 3.484-1.598 3.484-3.523s-1.559-3.524-3.484-3.524h-1.083c-.253-1.691-1.699-2.908-3.447-2.908-1.8 0-3.28 1.415-3.465 3.168" style="fill:var(--weather-icon-cloud-back-color, #d4d4d4)"/><path d="M4.2 7.7a2.14 2.14 0 0 0-.888.533c-.39.39-.632.923-.632 1.517 0 1.19.964 2.144 2.154 2.144H9.14c1.19 0 2.153-.988 2.153-2.178s-.963-2.178-2.153-2.178h-.67c-.156-1.045-1.05-1.797-2.13-1.797-1.112 0-2.027.875-2.141 1.958" style="fill:var(--weather-icon-cloud-front-color, #f9f9f9)"/></svg>
                            </div>
                            <div>
                                <p class="text-5xl font-semibold">60°</p>
                            </div>
                        </div>
                        <div class="flex flex-row gap-4 text-xl">
                            <div class="flex items-center gap-1">
                                <img src="icons/wind.svg" class="w-6 h-6 rotate-[165deg]">
                                <div class="flex items-baseline gap-1">
                                    <p>4</p>
                                    <p class="text-xs">mph</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-1">
                                <img src="icons/umbrella.svg" class="w-5 h-5">
                                <p>0%</p>
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-grow items-center justify-center">
                        <p class="text-xl text-center">Cloudy, light breeze</p>
                    </div>
                </div>
                
                <div class="flex-1 bg-white rounded-xl flex flex-col p-4 text-black shadow-md h-64">
                    <h2 class="text-base text-left font-semibold text-gray-600">5 PM TOMORROW</h2>
                    <div class="flex flex-col items-center">
                        <div class="flex flex-row items-center justify-center gap-2">
                            <div class="flex-shrink-0">
                                <svg class="weather-icon" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" viewBox="0 0 17 17"><path d="M14.393 8.403a5.995 5.995 0 1 1-11.99 0 5.995 5.995 0 0 1 11.99 0" style="fill:var(--weather-icon-sun-color, #fdd93c)"/></svg>
                            </div>
                            <div>
                                <p class="text-5xl font-semibold">85°</p>
                            </div>
                        </div>
                        <div class="flex flex-row gap-4 text-xl">
                            <div class="flex items-center gap-1">
                                <img src="icons/wind.svg" class="w-6 h-6 rotate-[75deg]">
                                <div class="flex items-baseline gap-1">
                                    <p>17</p>
                                    <p class="text-xs">mph</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-1">
                                <img src="icons/umbrella.svg" class="w-5 h-5">
                                <p>1%</p>
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-grow items-center justify-center">
                        <p class="text-xl text-center">Clear and breezy</p>
                    </div>
                </div>
                
            </div>

            <div class="flex flex-col flex-grow justify-between gap-4">
                <div>
                    <div class="p-4 bg-white rounded-lg shadow-md">
                        
                        <p class="text-gray-600 text-xl text-center italic">No events today</p>
                        
                        <ul class="text-black text-3xl space-y-2">
                            
                        </ul>
                        <hr class="border-black my-4">
                        <ul class="text-black text-xl space-y-2">
                            
                            <li class="flex items-baseline">
                                <span class="w-2/5 text-right pr-4 font-semibold">Thu, Aug 28</span>
                                <span
                                    class="w-3/5 text-left block overflow-hidden whitespace-nowrap text-ellipsis">Steven Ortho - 8:30 AM</span>
                            </li>
                            
                            <li class="flex items-baseline">
                                <span class="w-2/5 text-right pr-4 font-semibold">Mon, Sep 1</span>
                                <span
                                    class="w-3/5 text-left block overflow-hidden whitespace-nowrap text-ellipsis">Labor Day</span>
                            </li>
                            
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

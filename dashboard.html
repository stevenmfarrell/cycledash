<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycle Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html {
            box-sizing: border-box;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        body {
            margin: 0;
            font-family: "Tahoma", sans-serif;
            overflow: hidden;
            height:560px
        }

        .fixed-size-container {
            width: 800px;
            height: 480px;
        }
        .section-divider:not(:last-child) {
            border-bottom: 1px solid black;
            padding-bottom: 0.5rem;
        }
        .good-bg {
            background-color: #3A5B46;
        }
        .bad-bg {
            background-color: #9C484B;
        }
        .maybe-bg {
            background-color: #D0BE47;
        }
        .weather-icon {
            width: 150px;
            height: 150px;
        }
    </style>
</head>
<body class="bg-blue-100">

    <div class="fixed-size-container bg-white grid grid-cols-2 grid-rows-[auto_1fr]">

        <div class="col-span-2 px-4 pt-4">
             <h1 class="text-5xl text-left text-black mb-4">
                Sunday, Aug 3
            </h1>
        </div>

        <div class="flex flex-col px-4 gap-4">
            <div class="flex-1 relative good-bg rounded-lg flex flex-row justify-between items-center p-3">
                <div class="flex flex-col items-start">
                    <img src="http://openweathermap.org/img/wn/01d@2x.png" alt="Morning Weather Icon" class="rounded-md weather-icon">
                </div>
                <div class="flex flex-col items-center flex-grow text-white">
                    <p class="text-6xl">68°</p>
                    <p class="text-lg">Clear skies and light wind</p>
                </div>
                <h2 class="absolute bottom-2 right-2 text-base text-white">8 AM</h2>
            </div>

            <div class="flex-1 relative good-bg rounded-lg flex flex-row justify-between items-center p-3">
                 <div class="flex flex-col items-start">
                    <img src="http://openweathermap.org/img/wn/01d@2x.png" alt="Evening Weather Icon" class="rounded-md weather-icon">
                </div>
                <div class="flex flex-col items-center justify-center flex-grow text-white">
                    <p class="text-6xl">93°</p>
                    <p class="text-lg">Clear, warm, low wind</p>
                </div>
                <h2 class="absolute bottom-2 right-2 text-base text-white">5 PM</h2>

            </div>
        </div>

        <div class="flex flex-col px-4 gap-4">
            <div class="section-divider">
                <h3 class="text-lg font-semibold text-black mb-2">Today</h3>
                 <div class="p-2 bg-white rounded-lg">
                    
                    <ul class="list-disc list-inside text-black text-base">
                        
                            <li>Rigby</li>
                        
                    </ul>
                </div>
            </div>

            <div class="section-divider">
                <h3 class="text-lg font-semibold text-black mb-2">Tomorrow</h3>
                 <div class="p-2 bg-white rounded-lg">
                    
                    <ul class="list-disc list-inside text-black text-base">
                        
                            <li>Rigby</li>
                        
                    </ul>
                </div>
            </div>

            <div> 
                
            </div>
        </div>
    </div>
</body>
</html>

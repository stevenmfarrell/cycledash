<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycle Dashboard - Tall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Using the Inter font for a cleaner look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        html {
            box-sizing: border-box;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            /* The new background color, taken from the old forecast cards */
            background-color: #c4d6ff;
        }

        /* New tall container dimensions */
        .tall-container {
            width: 480px;
            height: 800px;
        }
        /* These classes are no longer used for background but kept for potential future use */
        .good-bg {
            background-color: #1dad23;
        }
        .bad-bg {
            background-color: #9C484B;
        }
        .maybe-bg {
            background-color: #D0BE47;
        }
        /* Increased icon size */
        .weather-icon {
            width: 80px;
            height: 80px;
        }
    </style>
</head>
<!-- Swapped the background color to the dark green -->
<body class="flex min-h-screen">

    <!-- Main container now controls padding and spacing for its children -->
    <div class="tall-container flex flex-col good-bg">
        <div class="flex flex-col p-6 gap-6 good-bg">
        <!-- Header Section - Padding removed, now handled by parent -->
        <div>
             <h1 class="text-5xl font-semibold text-left text-white">
                Sunday, Aug 3
            </h1>
        </div>
        <div class="flex flex-row gap-4">
            <!-- Morning Forecast -->
            <div class="flex-1 relative bg-white rounded-xl flex flex-col justify-center items-center p-4 text-gray-800 shadow-md h-48">
                <!-- Main content container -->
                <div class="flex flex-col items-center">
                    <!-- Top row: Icon + Temp -->
                    <div class="flex flex-row items-center justify-center gap-2">
                        <div class="flex-shrink-0">
                            <img src="https://openweathermap.org/img/wn/01d@2x.png" alt="Morning Weather Icon" class="rounded-md weather-icon" onerror="this.onerror=null;this.src='https://placehold.co/80x80/FFFFFF/333333?text=Icon';">
                        </div>
                        <div>
                            <p class="text-4xl font-semibold">68°</p>
                        </div>
                    </div>
                    <!-- Bottom row: Description -->
                    <div class="mt-2">
                        <p class="text-lg text-center">Clear skies & light wind</p>
                    </div>
                </div>
                <!-- Time text changed to dark gray -->
                <h2 class="absolute bottom-3 right-4 text-sm font-semibold text-gray-500">8 AM</h2>
            </div>

            <!-- Evening Forecast -->
            <div class="flex-1 relative bg-white rounded-xl flex flex-col justify-center items-center p-4 text-gray-800 shadow-md h-48">
                 <!-- Main content container -->
                <div class="flex flex-col items-center">
                    <!-- Top row: Icon + Temp -->
                    <div class="flex flex-row items-center justify-center gap-2">
                        <div class="flex-shrink-0">
                            <img src="https://openweathermap.org/img/wn/01d@2x.png" alt="Evening Weather Icon" class="rounded-md weather-icon" onerror="this.onerror=null;this.src='https://placehold.co/80x80/FFFFFF/333333?text=Icon';">
                        </div>
                        <div>
                            <p class="text-4xl font-semibold">93°</p>
                        </div>
                    </div>
                    <!-- Bottom row: Description -->
                    <div class="mt-2">
                        <p class="text-lg text-center">Clear, warm, low wind</p>
                    </div>
                </div>
                <!-- Time text changed to dark gray -->
                <h2 class="absolute bottom-3 right-4 text-sm font-semibold text-gray-500">5 PM</h2>
            </div>
        </div>

        <!-- Lists Section - Padding and margin removed, now handled by parent -->
        <div class="flex flex-col flex-grow justify-between gap-4">
            <!-- Top Group: Today's card -->
            <div>
                <div class="p-4 bg-white rounded-lg shadow-md">
                    <ul class="text-gray-800 text-2xl space-y-2">
                        <li class="flex items-baseline">
                            <span class="w-2/5 text-right pr-4 font-semibold">All Day</span>
                            <span class="w-3/5 text-left">Rigby</span>
                        </li>
                        <li class="flex items-baseline">
                            <span class="w-2/5 text-right pr-4 font-semibold">10 AM</span>
                            <span class="w-3/5 text-left">Dentist</span>
                        </li>
                    </ul>
                    <hr class="border-gray-200 my-4">
                    <!-- List is now a two-column layout -->
                    <ul class="text-gray-800 text-lg space-y-2">
                        <li class="flex items-baseline">
                            <span class="w-2/5 text-right pr-4 font-semibold">Tomorrow</span>
                            <span class="w-3/5 text-left">Rigby</span>
                        </li>
                        <li class="flex items-baseline">
                            <span class="w-2/5 text-right pr-4 font-semibold">Tomorrow</span>
                            <span class="w-3/5 text-left">Game Night - 7 PM</span>
                        </li>
                        <li class="flex items-baseline">
                            <span class="w-2/5 text-right pr-4 font-semibold">Aug 8</span>
                            <span class="w-3/5 text-left">Star Wars</span>
                        </li>
                         <li class="flex items-baseline">
                            <span class="w-2/5 text-right pr-4 font-semibold">Sep 1</span>
                            <span class="w-3/5 text-left">Joey's Birthday</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        </div>
    </div>
</body>
</html>
